<!doctype html>
<!-- Source for public/og-image.png, the link-preview image (1200 × 630). Regenerate: npm run gen:og -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    padding: 0 96px; display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(ellipse 90% 80% at 70% 45%, #2a7a51 0%, #1f6142 45%, #0e2a1b 100%);
    color: #f3ecdc; font-family: 'IBM Plex Sans', sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 112px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
  .tag { font-size: 50px; font-weight: 600; margin: 44px 0 0; line-height: 1.15; }
  .list { font-size: 32px; font-weight: 500; margin: 26px 0 0; color: rgba(243,236,220,.82); }
</style>
</head>
<body>
  <div class="brand">
    <img src="../../public/favicon.svg" alt="" />
    <h1>Felt School</h1>
  </div>
  <p class="tag">No-Limit Hold’em decision trainer</p>
  <p class="list">Practice hands · Lessons · Ranges · Live play-money tables</p>
</body>
</html>
